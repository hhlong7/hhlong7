<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="-5 -5 240 240" role="img" aria-label="Most used languages"><title>Most used languages</title><style>@font-face{font-family:'Instrument Serif';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Geist Mono';font-weight:500;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Inter';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}.d7{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-style:normal}.m4{font-family:'Geist Mono',ui-monospace,monospace;font-weight:400;font-style:normal}.m5{font-family:'Geist Mono',ui-monospace,monospace;font-weight:500;font-style:normal}.b4{font-family:'Inter',system-ui,sans-serif;font-weight:400;font-style:normal}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}
@keyframes fi{from{opacity:0}}
@keyframes gr{from{transform:scaleY(0)}}
@keyframes sc{from{opacity:0;transform:scale(.3)}}
@keyframes dr{from{stroke-dashoffset:1}}
@keyframes rd{from{transform:scale(0)}}
.fu{animation:fu .7s cubic-bezier(.2,.7,.2,1) backwards}
.fi{animation:fi .8s ease-out backwards}
.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr .8s cubic-bezier(.2,.7,.2,1) backwards}
.sc{transform-box:fill-box;transform-origin:50% 50%;animation:sc .45s ease-out backwards}
.dr{animation:dr 1.1s ease-out backwards}
.rd{animation:rd 1s cubic-bezier(.2,.8,.2,1) backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.smil{display:none}}
